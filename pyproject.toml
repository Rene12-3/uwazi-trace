[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwazi-trace"
version = "0.1.0"
description = "Evidence-first review of public procurement data: peer-adjusted indicators, alert cards, and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.26", "streamlit>=1.50"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uwazi.ui" = ["fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E702", "E701"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app.py" = ["E501"]
"src/uwazi/ui/*" = ["E501"]
"src/uwazi/indicators.py" = ["E501"]
"src/uwazi/synthetic.py" = ["E501"]
